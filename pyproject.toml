[project]
name = "uni-assist"
version = "0.1.0"
description = "Chet elda o'qish uchun universitet va grant tanlash Telegram boti"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiogram>=3.15,<4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "sqladmin[full]>=0.20.1",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "python-dotenv>=1.0.1",
    "itsdangerous>=2.2.0",
    "babel>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    # Docker o'rnatmasdan mahalliy ishlash uchun (scripts/dev_postgres.py) —
    # production'da ishlatilmaydi, u yerda docker-compose.yml'dagi haqiqiy Postgres bor.
    "pgserver>=0.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# RUF012: SQLAdmin ModelView'lar column_list/form_columns kabi konfiguratsiya
# maydonlarini oddiy list class-attribute sifatida kutadi (kutubxonaning o'zi
# shunday hujjatlashtirgan) — bu yerda haqiqiy "mutable shared state" xatosi emas.
ignore = ["RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
